<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gold Price Estimation</title>
  <style>
    body {
      font-family: Times New Roman, sans-serif;
      background-image: url('gold.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      padding: 40px;
    }

    .container {
      background: rgba(245, 250, 255, 0.9);
      padding: 20px;
      max-width: 600px;
      margin: auto;
      border: 2px solid #333;
      border-radius: 8px;
    }

    label, input, select {
      display: block;
      width: 100%;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .row input, .row select {
      width: 45%;
    }

    .total {
      font-weight: bold;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <label for="goldRate">Gold Rate (per gram):</label>
      <input type="text" id="goldRate" placeholder="Fetching..." readonly />
    </div>

    <div class="row">
      <label for="category">Select Category:</label>
      <select id="category">
        <option value="Ring">Ring</option>
        <option value="Necklace">Necklace</option>
        <option value="Bangle">Bangle</option>
        <option value="Bracelet">Bracelet</option>
        <option value="Earring">Earring</option>
        <option value="Pendant">Pendant</option>
      </select>
    </div>

    <div class="row">
      <label for="type">Select Type:</label>
      <select id="type">
        <option value="">-- Select Type --</option>
      </select>
    </div>

    <div class="row">
      <label for="goldWeight">Gold Weight:</label>
      <input type="text" id="goldWeight" placeholder="Enter weight" />
      <input type="text" id="goldPrice" placeholder="Gold price amt" readonly />
    </div>

    <div class="row">
      <label for="makingPercent">Making Charge %:</label>
      <input type="text" id="makingPercent" placeholder="%" />
      <input type="text" id="makingAmount" placeholder="Making charge amt" readonly />
    </div>

    <div class="row">
      <label for="wastePercent">Waste %:</label>
      <input type="text" id="wastePercent" placeholder="%" />
      <input type="text" id="wasteAmount" placeholder="Wastage amt" readonly />
    </div>

    <div class="row">
      <label for="taxPercent">Tax %:</label>
      <input type="text" id="taxPercent" placeholder="%" />
      <input type="text" id="taxAmount" placeholder="Tax amt" readonly />
    </div>

    <div class="row total">
      <label for="totalAmount">Total Amount:</label>
      <input type="text" id="totalAmount" placeholder="Final amt" readonly />
    </div>
  </div>

  <script>
    async function fetchGoldRate() {
      try {
        const response = await fetch("https://www.goldapi.io/api/XAU/INR", {
          method: "GET",
          headers: {
            "x-access-token": "goldapi-71kc17mbqcjf2v-io",
            "Content-Type": "application/json"
          }
        });

        const data = await response.json();
        if (data && data.price) {
          const ratePerOunce = data.price;
          const ratePerGram = ratePerOunce / 31.1035;
          document.getElementById('goldRate').value = ratePerGram.toFixed(2);
        } else {
          alert("Failed to get gold rate: " + (data.message || "Unknown error"));
        }
      } catch (error) {
        alert("API error: " + error.message);
      }
    }

    async function fetchTypesByCategory(category) {
      try {
        const res = await fetch(`http://localhost:3000/api/types/${category}`);
        const data = await res.json();

        const typeDropdown = document.getElementById('type');
        typeDropdown.innerHTML = '<option value="">-- Select Type --</option>';

        data.forEach(item => {
          const option = document.createElement('option');
          option.value = item.P_Name;
          option.textContent = item.P_Name;
          typeDropdown.appendChild(option);
        });

      } catch (err) {
        console.error(err);
        alert("Failed to load types for category");
      }
    }

    async function fetchTypeDetails(typeName) {
      try {
        const res = await fetch(`http://localhost:3000/api/item/${typeName}`);
        const data = await res.json();

        if (data.error) {
          alert(data.error);
          return;
        }

        document.getElementById('goldWeight').value = data.weight;
        document.getElementById('makingPercent').value = data.making_charge_percent;
        document.getElementById('wastePercent').value = data.waste_percent;
        document.getElementById('taxPercent').value = data.tax_percent;

        calculate();
      } catch (err) {
        console.error(err);
        alert("Failed to load type details");
      }
    }

    function calculate() {
      const rate = parseFloat(document.getElementById('goldRate').value) || 0;
      const weight = parseFloat(document.getElementById('goldWeight').value) || 0;
      const makingPercent = parseFloat(document.getElementById('makingPercent').value) || 0;
      const wastePercent = parseFloat(document.getElementById('wastePercent').value) || 0;
      const taxPercent = parseFloat(document.getElementById('taxPercent').value) || 0;

      const goldPrice = rate * weight;
      const makingCharge = goldPrice * (makingPercent / 100);
      const wastage = goldPrice * (wastePercent / 100);
      const subtotal = goldPrice + makingCharge + wastage;
      const tax = subtotal * (taxPercent / 100);
      const total = subtotal + tax;

      document.getElementById('goldPrice').value = goldPrice.toFixed(2);
      document.getElementById('makingAmount').value = makingCharge.toFixed(2);
      document.getElementById('wasteAmount').value = wastage.toFixed(2);
      document.getElementById('taxAmount').value = tax.toFixed(2);
      document.getElementById('totalAmount').value = total.toFixed(2);
    }

    document.getElementById('category').addEventListener('change', (e) => {
      const category = e.target.value;
      fetchTypesByCategory(category);
    });

    document.getElementById('type').addEventListener('change', (e) => {
      const typeName = e.target.value;
      if (typeName) {
        fetchTypeDetails(typeName);
      }
    });

    document.querySelectorAll('input[type="text"]').forEach(input => {
      input.addEventListener('input', calculate);
    });

    window.onload = fetchGoldRate;
  </script>
</body>
</html>
